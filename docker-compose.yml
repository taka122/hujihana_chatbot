services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: ["/app/scripts/start-api.sh"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rag
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: rag-documents
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - minio
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./secrets:/run/secrets:ro

  worker:
    build: .
    command: ["/app/scripts/start-worker.sh"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rag
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: rag-documents
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - minio
      - redis
    volumes:
      - .:/app
      - ./secrets:/run/secrets:ro

  frontend:
    profiles: ["frontend"]
    image: node:20-alpine
    working_dir: /app
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -d node_modules/next ]; then
          npm ci
        fi
        exec npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      API_PROXY_TARGET: http://api:8000
      CLINIC_PASSWORD: ${CLINIC_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FACILITIES_CSV_PATH: /app/data/facilities_sample.csv
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./next-chat-ui:/app
      - next_node_modules:/app/node_modules
      - ./data:/app/data:ro

volumes:
  postgres_data:
  minio_data:
  next_node_modules:
